<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📊 Chatbot Analytics Dashboard</h1>
        
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Messages</h3>
                <p class="stat-value" id="total-messages">0</p>
            </div>
        </div>
        
        <div class="section">
            <h2>Message Categories</h2>
            <div id="categories"></div>
        </div>
        
        <div class="section">
            <h2>Recent Messages</h2>
            <div id="logs"></div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
